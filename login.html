<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>ログイン | にこにこ工作部 ボランティアポータル</title>
    <link rel="icon" href="file/icon.png">
    <link rel="apple-touch-icon" href="file/icon.png">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f2f2f2;
        }
        .login-container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 350px;
            text-align: center;
        }
        .login-container img {
            width: 80px;
            margin-bottom: 20px;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
            position: relative;
        }
        .input-group label {
            display: block;
            font-size: 14px;
            color: #333;
            margin-bottom: 5px;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
        }
        .toggle-password {
            position: absolute;
            right: 10px;
            top: 35px;
            cursor: pointer;
            width: 24px;
            height: 24px;
            fill: #666;
        }
        .login-btn {
            background-color: #0066cc;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 5px;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .login-btn:hover {
            background-color: #0055aa;
        }
        #errorMessage {
            color: red;
            font-size: 13px;
            margin-top: 15px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <img src="file/icon.png" alt="">
        <h2 style="margin-top:0; font-size:18px; color:#333;">システムログイン</h2>
        
        <div class="input-group">
            <label>ログインID</label>
            <input type="text" id="loginId" placeholder="例: admin">
        </div>
        
        <div class="input-group">
            <label>パスワード</label>
            <input type="password" id="loginPass" placeholder="パスワード">
            <svg class="toggle-password" id="toggleIcon" viewBox="0 0 24 24">
                <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
            </svg>
        </div>
        
        <button class="login-btn" id="loginBtn">ログイン</button>
        <div id="errorMessage">IDまたはパスワードが間違っています。</div>
    </div>

    <script type="module">
        import { auth, db, signInWithEmailAndPassword } from "./js/firebase-config.js";
        import { collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

        const passInput = document.getElementById("loginPass");
        const toggleIcon = document.getElementById("toggleIcon");
        
        toggleIcon.addEventListener("click", () => {
            if (passInput.type === "password") {
                passInput.type = "text";
                toggleIcon.innerHTML = '<path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/>';
            } else {
                passInput.type = "password";
                toggleIcon.innerHTML = '<path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>';
            }
        });

        document.getElementById("loginBtn").addEventListener("click", async () => {
            const id = document.getElementById("loginId").value;
            const pass = document.getElementById("loginPass").value;
            const email = id + "@nikoniko.local";

            try {
                await signInWithEmailAndPassword(auth, email, pass);
                
                const q = query(collection(db, "members"), where("loginId", "==", id));
                const querySnapshot = await getDocs(q);
                
                let userRole = "会員"; 
                querySnapshot.forEach((doc) => {
                    userRole = doc.data().role;
                });
                
                localStorage.setItem("userRole", userRole);
                window.location.href = "index.html";
                
            } catch (error) {
                console.error(error);
                document.getElementById("errorMessage").style.display = "block";
            }
        });
    </script>
</body>
</html>
